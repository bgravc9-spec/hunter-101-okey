/* HUNTER GAMES 101 V3 - true edge-to-edge landscape game room */
:root {--v3blue:#0a81ff;--v3red:#f31d4d;--v3violet:#8b24f6;--v3gold:#ffbd58}
body:has(.v3-game){overflow:hidden}
body:has(.v3-game) .modal-back{z-index:410!important}
body:has(.v3-game) .toast{z-index:415!important}
.v3-game{position:fixed;inset:0;z-index:150;display:flex;flex-direction:column;overflow:hidden;color:#f5f6ff;background:radial-gradient(ellipse at 55% 42%,#142e40 0%,#090c1a 72%),#080b17;font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;isolation:isolate}
.v3-game *{box-sizing:border-box}
.v3-head{height:clamp(48px,7.7vh,86px);flex:none;display:flex;align-items:center;gap:clamp(5px,.9vw,17px);padding:0 clamp(10px,1.7vw,30px);background:linear-gradient(90deg,#070c1a,#070e1f 56%,#080917);border-bottom:1px solid #4d2853;box-shadow:0 2px 15px #0009;z-index:20}
.v3-brand{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-right:clamp(0px,1vw,12px);max-width:180px}
.v3-brand img{width:clamp(35px,4.9vw,64px);height:clamp(35px,4.9vw,64px);object-fit:cover;border-radius:12px;filter:drop-shadow(0 0 10px #f4256870)}
.v3-brandtxt{font-weight:1000;font-size:clamp(11px,1.36vw,18px);line-height:.92;letter-spacing:.3px;text-shadow:0 2px 6px #000}
.v3-brandtxt b{display:block;color:#ff315a;letter-spacing:2px}
.v3-hnav{display:flex;align-items:stretch;gap:clamp(2px,.55vw,9px);height:77%}
.v3-navbtn{min-width:clamp(43px,6.2vw,105px);padding:4px clamp(3px,.5vw,12px);display:grid;place-items:center;align-content:center;gap:2px;border:1px solid transparent;border-radius:12px;background:transparent;color:#dbe9f8;font-size:clamp(8px,.9vw,14px);white-space:nowrap}
.v3-navbtn span{font-size:clamp(17px,1.85vw,27px);line-height:1.1}
.v3-navbtn.active{background:linear-gradient(135deg,#9b173b91,#2f0d2a);border-color:#fa3263;box-shadow:0 0 18px #ec22503d;color:white}
.v3-top-right{margin-left:auto;display:flex;align-items:center;gap:clamp(6px,.8vw,16px);min-width:0}
.v3-top-coin{padding:7px 11px;border:1px solid #1e5c9d;border-radius:11px;background:linear-gradient(90deg,#10162a,#09152a);display:flex;align-items:center;gap:9px;color:#ffd978;font-size:clamp(10px,1.3vw,20px);font-weight:900;white-space:nowrap}
.v3-iconbtn{border:1px solid #294161;background:#0c1729;color:#cce7ff;border-radius:10px;width:clamp(31px,3.3vw,51px);height:clamp(31px,3.3vw,51px);display:grid;place-items:center;font-size:clamp(17px,1.65vw,24px)}
.v3-profile{display:flex;align-items:center;gap:10px;min-width:0;max-width:180px}.v3-profile .v3-portrait{width:clamp(32px,4vw,54px);height:clamp(32px,4vw,54px);border-radius:50%;border:2px solid #fa355e;display:grid;place-items:center;background:linear-gradient(135deg,#65163a,#12385a);font-size:23px;box-shadow:0 0 10px #e72b5f5c}
.v3-profiletxt{font-size:clamp(10px,.92vw,13px);line-height:1.4;white-space:nowrap}.v3-profiletxt small{display:block;color:#b7c4d9}.v3-xp{width:100%;height:5px;background:#162841;border-radius:10px;margin-top:3px;overflow:hidden}.v3-xp i{display:block;height:100%;background:#148afe;box-shadow:0 0 8px #0fa4ff}
.v3-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(78px,13vw,216px);gap:clamp(5px,.55vw,10px);padding:clamp(5px,.6vw,10px)}
.v3-playarea{min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(4px,.48vh,9px)}
.v3-table{flex:1 1 auto;min-height:70px;position:relative;overflow:hidden;border:clamp(5px,.95vw,14px) solid #542d1c;border-radius:clamp(17px,3vw,49px);box-shadow:inset 0 0 0 3px #ad6b32,inset 0 0 0 7px #150d14,0 10px 20px #000b;background:linear-gradient(150deg,#422315,#9d5932 9%,#452817 15%,#774122 90%,#211616)}
.v3-table:before{content:'';position:absolute;inset:clamp(3px,.6vw,9px);border:2px solid #14314d;border-radius:clamp(15px,2.5vw,37px);box-shadow:inset 0 0 0 4px #113449, inset 0 0 40px #000b;background:radial-gradient(ellipse at 53% 35%,#174252,#0b2739 58%,#081929 100%)}
.v3-ambience{pointer-events:none;position:absolute;z-index:0;inset:0 0 54% 0;opacity:.33;background-position:center top;background-size:cover;filter:blur(2px);mask-image:linear-gradient(black,transparent)}
.v3-table-fleck{pointer-events:none;position:absolute;inset:8px;border-radius:42px;background:repeating-linear-gradient(70deg,#ffffff06 0 1px,transparent 1px 11px);opacity:.32}
.v3-wolfmark{position:absolute;z-index:1;width:min(24%,195px);aspect-ratio:1;left:50%;top:50%;transform:translate(-50%,-45%);opacity:.23;filter:saturate(.6) grayscale(.3);border-radius:50%;object-fit:cover;mask-image:radial-gradient(ellipse,#000 42%,transparent 73%);pointer-events:none}
.v3-marktxt{position:absolute;z-index:1;left:0;right:0;top:67%;text-align:center;font-weight:1000;font-size:clamp(9px,1.15vw,21px);letter-spacing:.19em;color:#7fb5cd4a;pointer-events:none}
.v3-meta{position:absolute;z-index:8;top:clamp(6px,.9vw,15px);left:clamp(7px,1vw,15px);border:1px solid #384966;border-radius:10px;padding:clamp(5px,.8vw,13px);background:#080e20dc;display:grid;gap:3px;max-width:25%;font-size:clamp(8px,.94vw,15px);box-shadow:0 8px 15px #0008}
.v3-meta b{color:#fff}.v3-meta small{color:#b8c9db;font-size:clamp(8px,.79vw,12px)}.v3-meta button{border:1px solid #b82c50;border-radius:8px;background:#75142b;color:white;padding:6px 8px;font-size:clamp(8px,.8vw,12px);margin-top:3px}
.v3-brief{position:absolute;z-index:8;top:clamp(7px,.9vw,15px);right:clamp(7px,1vw,17px);border:1px solid #33476c;background:#07152cdb;border-radius:10px;padding:clamp(6px,.9vw,12px);font-size:clamp(9px,.95vw,14px);display:grid;gap:clamp(2px,.35vw,8px)}.v3-brief strong{color:#ffcf66}
.v3-seat{position:absolute;z-index:5;display:flex;align-items:center;gap:clamp(3px,.45vw,9px);padding:clamp(3px,.42vw,7px) clamp(5px,.6vw,9px);border:1px solid #b44461;border-radius:14px;background:linear-gradient(100deg,#111527e8,#091b30ec);box-shadow:0 4px 11px #0008;white-space:nowrap;min-width:0}
.v3-seat.north{top:5%;left:50%;transform:translateX(-50%)}.v3-seat.west{top:51%;left:1.2%;transform:translateY(-50%)}.v3-seat.east{top:51%;right:1.2%;transform:translateY(-50%)}.v3-seat.self{bottom:3%;left:50%;transform:translateX(-50%);border-color:#2faeff;background:#0a1832e8}
.v3-seat .v3-av{display:grid;place-items:center;flex:none;width:clamp(23px,3.05vw,51px);height:clamp(23px,3.05vw,51px);border-radius:50%;border:2px solid #e02c5d;background:linear-gradient(135deg,#92284b,#1c4789);color:white;font-weight:900;font-size:clamp(12px,1.6vw,24px)}
.v3-seat.self .v3-av{border-color:#288cff}.v3-seat b{display:block;font-size:clamp(9px,1.05vw,16px)}.v3-seat span{display:block;color:#ffda72;font-size:clamp(8px,.87vw,13px);font-weight:800}.v3-seat.onturn{border-color:#39bbff;box-shadow:0 0 12px #168aff8a}

<style id="hunter-v31-okey-visual-fix">
/* V31: 101 Okey landscape-on-portrait, preserve actual 4-seat board and usable rack.
   Root cause: .v13-game.v21-game wins specificity against earlier portrait .v13-game.
   The old 36vh rack (calculated from portrait SCREEN height) collapsed the board.
   In rotated view use 100vw (the logical landscape height) for horizontal bands. */
@media (orientation:portrait) and (max-width:900px){
 .v13-game.v21-game{
  top:0!important;left:100vw!important;right:auto!important;bottom:auto!important;
  width:100dvh!important;height:100vw!important;
  transform:rotate(90deg)!important;transform-origin:top left!important;
  grid-template-rows:clamp(30px,8vw,43px) minmax(0,1fr) clamp(153px,42vw,184px)!important;
 }
 .v21-game .v21-middle{min-height:0;grid-template-columns:clamp(36px,9vw,52px) minmax(0,1fr) clamp(62px,16vw,90px) clamp(36px,9vw,52px)!important;gap:3px;padding:2px 3px 0}
 .v21-game .v13-top{padding:1px 5px!important;min-height:0}
 .v21-game .v13-top-left,.v21-game .v13-top-right{gap:4px}
 .v21-game .v13-top-pill{height:clamp(22px,6vw,31px);min-height:0!important;max-height:100%;padding:1px 4px!important;white-space:nowrap}
 .v21-game .v13-top-person{min-width:clamp(110px,28vw,160px);max-width:31%;max-height:100%;min-height:0}
 .v21-game .v13-top-person img{max-height:100%;width:auto;aspect-ratio:1}
 .v21-game .v13-store{display:none!important}
 .v21-game .v13-top-right .v13-tiny-button{height:clamp(24px,6vw,31px);min-width:29px;padding:1px 4px}
 .v21-game .v13-top-right .v13-tiny-button[data-v3-action="scores"]{display:none}
 .v21-game .v13-bottom{min-height:0;padding:0 3px 3px!important;grid-template-rows:clamp(19px,5vw,26px) clamp(13px,3.7vw,18px) minmax(0,1fr)!important;gap:1px!important}
 .v21-game .v21-scorebar{min-height:0}
 .v21-game .v21-bottom-body{min-height:0;grid-template-columns:clamp(36px,10vw,52px) minmax(0,1fr) clamp(36px,10vw,52px)!important;gap:3px}
 .v21-game .v13-rack-shell{min-height:0;grid-template-rows:minmax(0,1fr) clamp(17px,4.4vw,23px)!important}
 .v21-game .v13-rack .v3-grid{grid-template-columns:repeat(21,minmax(0,1fr))!important;grid-template-rows:repeat(2,minmax(0,1fr))!important}
 .v21-game .v13-sort{font-size:clamp(10px,2.4vw,15px)}
 .v21-game .v13-control-strip{gap:2px;min-height:0}
 .v21-game .v13-control-strip button{padding:2px 4px!important}
}
/* Keep actionable controls above internal decorations at short landscape heights. */
@media (orientation:landscape) and (max-height:430px){
 .v21-game .v13-top-person{min-height:0}
 .v21-game .v13-control-strip{position:relative;z-index:11}
 .v21-game .v21-open-buttons{position:relative;z-index:12}
}
</style>

function missionList(compact){
  if(state.tasks?.date!==dateKey()){
    state.tasks={date:dateKey(),progress:{win1:0,play2:0,withFriend:0}};
  }
  const tasks=[
    {key:'win1',ico:'🏆',name:'1 El 101 Okey Kazan',xp:100,goal:1},
    {key:'play2',ico:'🎮',name:'2 Oyun Oyna',xp:50,goal:2},
    {key:'withFriend',ico:'👥',name:'Arkadaşınla Oyna',xp:75,goal:1}
  ];
  return tasks.slice(0,compact?2:3).map(m=>{
    const cur=state.tasks?.progress?.[m.key]||0;
    const done=cur>=m.goal;
    return `<div class="mission"><div class="mission-icon">${m.ico}</div><div><b>${m.name}</b><br><small>+${m.xp} EXP</small></div><span class="tiny ${done?'green':'muted'}">${Math.min(cur,m.goal)} / ${m.goal}${done?' ✓':''}</span></div>`;
  }).join('');
}
function record(note,sum){state.history.unshift({note,sum,date:new Date().toLocaleString('tr-TR')});state.history=state.history.slice(0,40);persist()}
function checkAchievements(){
  hydrateProgress();
  const unlocked=[];
  for(const a of ACHIEVEMENTS){
    if(!state.achievements.includes(a.id)&&a.check(state)){
      state.achievements.push(a.id);
      state.coins+=5000;
      record(a.name+' başarımı açıldı',5000);
      unlocked.push(a);
    }
  }
  if(unlocked.length){
    persist();syncHeader();
    toast(`🏆 Başarım! ${unlocked.map(a=>a.icon+' '+a.name).join(', ')} (+${unlocked.length*5000} çip)`);
  }
}
function updateTasks(wonHand,withFriend=false){
  hydrateProgress();
  if(state.tasks?.date!==dateKey()){
    state.tasks={date:dateKey(),progress:{win1:0,play2:0,withFriend:0}};
  }
  if(wonHand)state.tasks.progress.win1++;
  state.tasks.progress.play2++;
  if(withFriend)state.tasks.progress.withFriend++;
  persist();
}

let v4BotExecuting=false;
let v4SuppressClickUntil=0;
function v4TurnSummary(g){
 const me=g.players?.[0],order=[0,3,2,1];
 const names=order.map(i=>(g.names?.[g.players?.[i]]||'Oyuncu').split(' • ')[0]);

}
const v4Sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function v4RecordBot(g,uid,event){
 const name=(g.names?.[uid]||'Oyuncu').split(' • ')[0];
 g.botActivity=`${name} ${event}`;
 g.botHistory??=[];
 g.botHistory.push(`${name}: ${event}`);
 g.botHistory=g.botHistory.slice(-16);
 if(page==='room'&&isPractice())render();
}
// Exactly one bot at a time, in players[0] -> players[1] -> players[2] -> players[3] -> players[0] order.
runBots=async function(){
  if(v4BotExecuting||!practice||practice.isLocal||page!=='room')return;
  const session=practice,g=session.game;
  v4BotExecuting=true;
  try{
    let guard=0;
    while(session===practice&&page==='room'&&!session.isLocal&&g.status==='playing'&&g.players[g.turn]!=='YOU'&&guard++<3){
      const uid=g.players[g.turn];
      if(!uid)break;
      try{
        v4RecordBot(g,uid,'sırası başladı');
        await v4Sleep(450);
        if(session!==practice||page!=='room')return;
        if(!g.drawn){
          const top=g.discard?.at(-1);
          const canTake=top&&g.opened[uid]&&OkeyEngine.isWorkable(top,g.board,g.indicator);
          if(canTake&&Math.random()<.7){
            try{OkeyEngine.action(g,session.hands,session.secret,uid,'draw',{fromDiscard:true});v4RecordBot(g,uid,'yerden taş aldı');}
            catch(e){OkeyEngine.action(g,session.hands,session.secret,uid,'draw');v4RecordBot(g,uid,'ortadan taş çekti');}
          }else{OkeyEngine.action(g,session.hands,session.secret,uid,'draw');v4RecordBot(g,uid,'ortadan taş çekti');}
          await v4Sleep(450);
        }
        if(session!==practice||page!=='room')return;
        let hand=session.hands[uid];
        if(!g.opened[uid]&&g.drawn){
          try{
            const sug=OkeyEngine.suggestions(hand,g.indicator);
            const groups=sug.groups.map(t=>({tiles:t}));
            let score=0;
            for(const gr of groups){try{score+=OkeyEngine.validMeld(gr.tiles,g.indicator).points;}catch(e){}}
            const threshold=g.options.folded?Math.max(101,(g.maxOpenScore||100)+1):101;
            const used=groups.reduce((a,b)=>a+b.tiles.length,0);
            if(score>=threshold&&hand.length-used>=1&&groups.length){
              OkeyEngine.action(g,session.hands,session.secret,uid,'open',{groups,mode:'series'});
              v4RecordBot(g,uid,`${score} puanla açtı`);await v4Sleep(400);
            }else if(!g.options.folded){
              const pairs=v3Pairs(hand,g.indicator);
              if(pairs.groups.length>=5&&hand.length-pairs.groups.slice(0,5).flat().length>=1){
                OkeyEngine.action(g,session.hands,session.secret,uid,'open',{groups:pairs.groups.slice(0,5).map(t=>({tiles:t})),mode:'pair'});
                v4RecordBot(g,uid,'5 çiftle açtı');await v4Sleep(400);
              }
            }
          }catch(e){console.warn('Bot açılış:',e.message)}
        }
        hand=session.hands[uid];
        if(g.opened[uid]&&g.drawn&&hand.length>2){
          const works=OkeyEngine.getWorks(hand,g.board,g.indicator);
          if(works.length){
            try{OkeyEngine.action(g,session.hands,session.secret,uid,'work',works[0]);v4RecordBot(g,uid,'taş işledi');await v4Sleep(300);}
            catch(e){console.warn('Bot taş işleme:',e.message)}
          }
        }
        hand=session.hands[uid];
        if(!hand?.length)break;
        const scored=hand.map(tile=>{
          const f=OkeyEngine.face(tile,g.indicator);
          return {tile,isOkey:OkeyEngine.isOkey(tile,g.indicator),isWorkable:g.opened[uid]&&OkeyEngine.isWorkable(tile,g.board,g.indicator),number:f.number,count:hand.filter(t=>OkeyEngine.face(t,g.indicator).number===f.number).length};
        });
        scored.sort((a,b)=>{
          if(a.isOkey!==b.isOkey)return a.isOkey?1:-1;
          if(a.isWorkable!==b.isWorkable)return a.isWorkable?1:-1;
          if(a.count!==b.count)return a.count-b.count;
          return a.number-b.number;
        });
        let outcome,discarded;
        for(const candidate of scored){
          try{outcome=OkeyEngine.action(g,session.hands,session.secret,uid,'discard',{tile:candidate.tile});discarded=candidate.tile;break;}
          catch(err){console.warn('Bot taş atma:',err.message)}
        }
        if(!discarded){v4RecordBot(g,uid,'atabileceği taş bulunamadı');break;}
        if(outcome?.penalty)v4RecordBot(g,uid,`ceza ödedi (+${outcome.penalty})`);
        else v4RecordBot(g,uid,'taş attı');
        await v4Sleep(400);
      }catch(e){console.warn('Bot:',e);v4RecordBot(g,uid,'hamle hatası: '+e.message);break;}
    }
    if(session===practice&&page==='room'){
      if(g.players[g.turn]==='YOU'&&g.status==='playing')g.botActivity='🐺 Sıra sende! Ortadan taş çek veya yandan al.';
      render();
    }
  }finally{v4BotExecuting=false;}
};

function v8BuildSeparatedRack(groups,loose){
 let result=Array(V8_RACK_SIZE).fill(null),r=0,pos=0;
 const chunks=[...groups.map(g=>({tiles:g,per:true})),...loose.map(t=>({tiles:[t],per:false}))];
 for(let index=0;index<chunks.length;index++){
  const item=chunks[index],need=item.tiles.length;
  if(need>V8_RACK_COLS)throw Error('Tek bir per ıstakanın satırından uzun');
  let future=chunks.slice(index).reduce((n,a)=>n+a.tiles.length,0);
  // Keep a literal empty cell between pers / singles whenever there is room.
  let gap=pos>0&&need+1<=V8_RACK_COLS-pos&&(V8_RACK_SIZE-(r*V8_RACK_COLS+pos)-1>=future)?1:0;
  if(need+gap>V8_RACK_COLS-pos){r++;pos=0;gap=0;}
  if(r>1)return null;
  pos+=gap;
  for(const id of item.tiles){if(pos>=V8_RACK_COLS)return null;result[r*V8_RACK_COLS+pos++]=id;}
 }
 return result;
}

const v9OriginalBuildSeparatedRack=v8BuildSeparatedRack;
v8BuildSeparatedRack=function(groups,loose){
 // Each real meld forms a contiguous block. Every leftover tile forms one SINGLE contiguous block.
 const chunks=[...groups.map(a=>[...a])];if(loose.length)chunks.push([...loose]);
 let positions=Array(V8_RACK_SIZE).fill(null),row=0,col=0;
 for(let i=0;i<chunks.length;i++){
  let chunk=chunks[i],offset=0;
  while(offset<chunk.length){
   if(row>1)return null;
   if(col===V8_RACK_COLS){row++;col=0;continue}
   let available=V8_RACK_COLS-col;
   const isNewChunk=offset===0&&col>0;
   // All leftovers belong to ONE contiguous block: move entire block to the next row if needed.
   if(i===groups.length&&offset===0&&chunk.length<=V8_RACK_COLS&&chunk.length+1>available){row++;col=0;available=V8_RACK_COLS;}
   else if(isNewChunk){if(available<=1){row++;col=0;continue}else{col++;available--;}}
   // if a real meld doesn't fit on a single line, move it intact to next line
   if(i<groups.length&&chunk.length-offset>available&&col!==0){row++;col=0;continue;}
   const take=Math.min(chunk.length-offset,V8_RACK_COLS-col);
   for(let j=0;j<take;j++)positions[row*V8_RACK_COLS+col++]=chunk[offset++];
  }
 }
 return positions;
};

let v44TimerKey='',v44LastGame=null,v44TimerSince=Date.now();

 const g=activeRoom(),target=document.querySelector('.v44-game');
 if(!target||!g)return;

 if(textEl)textEl.textContent=left;

}

/* V29: eldeki geçerli yeni perleri otomatik bulan ve masaya koyan motor.
   Elle dizilmiş taşlar varsa yalnız o gruplar kullanılır. */
let v25Adding=false;
// Okey taşları da dahil edilirse, gerçek jokerin hangi taşı temsil ettiğini bul.
// Oyuncunun önceden seçtiği sayı/renk kombinasyonu değiştirilmez.
function v29ChooseMeld(tiles,indicator){
 const chosen=v24Chosen(tiles),faces=tiles.map(t=>({id:t,...OkeyEngine.face(t,indicator)}));
 const wilds=faces.filter(f=>f.wild&&!chosen[f.id]);
 const fixed=faces.filter(f=>!f.wild||chosen[f.id]).map(f=>chosen[f.id]?{...f,...chosen[f.id]}:f);
 const possibilities=OkeyEngine.meldOptions(tiles,indicator,chosen).sort((a,b)=>b.points-a.points);
 for(const option of possibilities){
  const map={...chosen};
  if(option.type==='set'){
   const n=fixed.length?fixed[0].number:13;
   const used=new Set(fixed.map(f=>f.color));
   const available=[1,2,3,4].filter(c=>!used.has(c));
   if(available.length<wilds.length)continue;
   wilds.forEach((w,i)=>{map[w.id]={color:available[i],number:n}});
  }else{
   const length=tiles.length;
   let found=false;
   for(let start=14-length;start>=1&&!found;start--){
    const colors=fixed.length?[fixed[0].color]:[1,2,3,4];
    for(const color of colors){
     if(fixed.some(f=>f.color!==color||f.number<start||f.number>=start+length))continue;
     const occupied=new Set(fixed.map(f=>f.number));
     if(occupied.size!==fixed.length)continue;
     const missing=[];for(let n=start;n<start+length;n++)if(!occupied.has(n))missing.push(n);
     if(missing.length!==wilds.length)continue;
     wilds.forEach((w,i)=>{map[w.id]={color,number:missing[i]}});
     found=true;break;
    }
   }
   if(!found)continue;
  }
  try{
   const check=OkeyEngine.validMeld(tiles,indicator,option.type,map);
   if(check.type!==option.type)continue;
   // Otomatik açılan per masada doğru sayı sırasıyla görünür.
   const sorted=[...tiles].sort((a,b)=>{
    const fa=map[a]||OkeyEngine.face(a,indicator),fb=map[b]||OkeyEngine.face(b,indicator);
    return option.type==='run'?fa.number-fb.number:fa.color-fb.color;
   });
   return {tiles:sorted,okeyAs:map,points:check.points};
  }catch(_){}
 }
 return null;
}

/* V36: Seri Aç fix ONLY. For auto opening, a genuine okey without a manual
   choice receives a legal face. Explicit user selections always win.
   The same validator handles already-staged groups and auto-discovered ones. */
async function v36SeriesOpen(){
 const g=activeRoom(),uid=myUid();
 if(!g||g.status!=='playing')return toast('Oyun henüz başlamadı.');
 if(g.players?.[g.turn]!==uid||!g.drawn)return toast('Seri açmak için kendi sıranı ve taş alma aşamasını bekle.');
 if(g.opened?.[uid])return toast('Elin zaten açık. Yeni per için PERİ YERE KOY düğmesini kullan.');
 const hand=[...(myHand()||[])];
 const staged=v6StageRows.filter(row=>row.length).map(row=>[...row]);
 const automatic=!staged.length;
 const source=automatic?v3OptimalGroups(hand,g.indicator).groups:staged;
 if(!source.length)return toast('Seri açmak için önce geçerli perler oluşturmalısın.');
 let groups=[];
 for(const tiles of source){
  if(tiles.length<3)return toast('Her seri veya grup en az 3 taştan oluşmalı.');
  const meld=v29ChooseMeld(tiles,g.indicator);
  if(!meld)return toast('Geçersiz per. Okey için seçtiğin sayı/renk varsa perle uyumunu kontrol et.');
  groups.push({tiles:meld.tiles,okeyAs:meld.okeyAs,points:meld.points});
 }
 // Leave at least one physical tile to discard after the opening.
 let used=groups.reduce((n,m)=>n+m.tiles.length,0);
 if(automatic){
  while(groups.length&&hand.length-used<1){
   const weakest=groups.reduce((best,m,i)=>m.points<groups[best].points?i:best,0);
   used-=groups[weakest].tiles.length;
   groups.splice(weakest,1);
  }
 }else if(hand.length-used<1)return toast('Bitiş için elde en az 1 taş kalmalı. Daha az taş aç.');
 if(!groups.length)return toast('Bitiş için elde en az 1 taş kalmalı.');
 const score=groups.reduce((n,m)=>n+m.points,0);
 const required=g.options?.folded?Math.max(101,(g.maxOpenScore||100)+1):101;
 if(score<required)return toast(`Seri açmak için ${required} puan gerekli · Şu an ${score} puan.`);
 const ids=groups.flatMap(m=>m.tiles);
 if(new Set(ids).size!==ids.length||ids.some(t=>!hand.includes(t)))return toast('Açılacak perlerde tekrar eden ya da elde bulunmayan taş var.');
 if(g.pickedDiscard?.uid===uid&&!ids.includes(g.pickedDiscard.tile))return toast('Yerden aldığın taşı ilk seri açılışında kullanmalısın.');
 openingMode='series';
 await doRoomAction('open',{mode:'series',groups:groups.map(m=>({tiles:m.tiles,okeyAs:m.okeyAs}))});
}
function v29FindAutoMelds(hand,indicator){
 // En yüksek toplam puanlı birbirini kesmeyen seri/grupları bul.
 const optimized=v3OptimalGroups(hand,indicator);
 let groups=optimized.groups.map(g=>v29ChooseMeld(g,indicator)).filter(Boolean);
 // Oynanış kuralı: her zaman atılacak en az bir taş kalmalı.
 while(groups.length&&hand.length-groups.reduce((n,g)=>n+g.tiles.length,0)<1){
  const weakest=groups.reduce((best,g,i)=>g.points<groups[best].points?i:best,0);
  groups.splice(weakest,1);
 }
 return groups.slice(0,6);
}

  const text=f.elements.namedItem('text')?.value.trim();if(!text||!hunterArenaId)return;

 }

const X47_COLS=13,X47_SIZE=26;
const x47PrevSync=v6SyncRack;
v6SyncRack=function(hand){
 const compact=v6RackSlots.length===X47_SIZE?[...v6RackSlots]:null;
 x47PrevSync(hand);
 if(compact){
  v6RackSlots=compact.map(t=>t&&hand.includes(t)?t:null);
  const seen=new Set(v6RackSlots.filter(Boolean));
  for(const t of hand){if(seen.has(t))continue;const i=v6RackSlots.indexOf(null);if(i<0)break;v6RackSlots[i]=t;seen.add(t)}
  return;
 }
 const rows=v6RackSlots.length>=42?[v6RackSlots.slice(0,21),v6RackSlots.slice(21,42)]:[v6RackSlots.filter(Boolean)];
 const slots=Array(X47_SIZE).fill(null);
 rows.forEach((row,r)=>row.filter(Boolean).slice(0,X47_COLS).forEach((t,i)=>{slots[r*X47_COLS+i]=t}));
 const used=new Set(slots.filter(Boolean));
 for(const t of rows.flat().filter(Boolean)){if(used.has(t))continue;const i=slots.indexOf(null);if(i<0)break;slots[i]=t;used.add(t)}
 v6RackSlots=slots;
};
v8BuildSeparatedRack=function(groups,loose){
 const chunks=[...groups.map(a=>[...a])];if(loose.length)chunks.push([...loose]);
 let positions=Array(X47_SIZE).fill(null),row=0,col=0;
 for(let i=0;i<chunks.length;i++){
  let chunk=chunks[i],offset=0;
  while(offset<chunk.length){
   if(row>1)return null;
   if(col===X47_COLS){row++;col=0;continue}
   let available=X47_COLS-col;
   const isNewChunk=offset===0&&col>0;
   if(i===groups.length&&offset===0&&chunk.length<=X47_COLS&&chunk.length+1>available){row++;col=0;available=X47_COLS;}
   else if(isNewChunk){if(available<=1){row++;col=0;continue}else{col++;available--;}}
   if(i<groups.length&&chunk.length-offset>available&&col!==0){row++;col=0;continue;}
   const take=Math.min(chunk.length-offset,X47_COLS-col);
   for(let j=0;j<take;j++)positions[row*X47_COLS+col++]=chunk[offset++];
  }
 }
 return positions;
};

 const slot=(i,cls)=>{const uid=who(i);const last=(g.discardPlays||[]).filter(x=>x.uid===uid&&x.round===g.round&&!x.taken).at(-1);const mine=uid===myUid();const take=!mine&&v17CanTakeDiscard(v)&&v17TakeableUid(v)===uid&&!!last;return `<button type="button" class="x47-throw ${cls} ${mine?'mine':''} ${last?'has':''}" ${mine?'data-v44-discard':''} ${take?'data-v17-take="left"':''} title="${mine?'Taşı sağ alt kutuya at':nm(uid)}">${last?staticTile(last.tile,g.indicator):''}</button>`};
 const canOpen=isMe&&g.drawn&&!g.opened?.[myUid()];
 return `<div id="v3Game" class="v3-game v44-game x47 ${isMe?'myturn':''}" aria-label="101 Okey masa">

   <section class="x47-table">
    <div class="x47-grid"><div class="x47-mark">101</div><div class="x47-felt-board">${v9Board(g,isMe)}</div></div>

     <button type="button" class="x47-deck" data-hg-action="draw" ${isMe&&!g.drawn?'':'disabled'} title="Desteden çek"><small>${g.deckCount??0}</small></button>

    </aside>
   </section>
   ${isMe?`<aside class="x47-turn">${v13NumberTile(okey.number,okey.color,'real')}<button type="button" data-v7-open="series">SERİ AÇ</button><button type="button" data-v7-open="pair">ÇİFT AÇ</button><button type="button" data-v6-action="clear" ${v6StageTiles().length?'':'disabled'}>GERİ TOPLA</button><button type="button" data-hg-action="autoWork" ${canWork&&works.length?'':'disabled'}>TAŞLARI İŞLE</button></aside>`:''}

 </div>`;
};
