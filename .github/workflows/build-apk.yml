name: HUNTER 101 Okey APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-34 build-tools;34.0.0 platform-tools

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Debug APK derle
        run: gradle --no-daemon :app:assembleDebug

      - name: APK dosyasini hazirla
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/HUNTER_GAMES_101_OKEY.apk

      - name: APK indirilebilir dosya olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: HUNTER_GAMES_101_OKEY_APK
          path: release/HUNTER_GAMES_101_OKEY.apk
          if-no-files-found: error
          retention-days: 14
